# Engineering workshop environments (docs/FEUILLE_DE_ROUTE_ATELIER.md §3.6, §8).
# Every package is pinned by sha256 in pixi.lock. Environments live outside the repo
# (MCPFC_HOME, set by install/install.ps1) and never touch FreeCAD's bundled Python.
# Tools talk to each other through files (STEP, VTU, JSON, URDF...), never by import.

[workspace]
name = "mcp-freecad-atelier"
channels = ["conda-forge"]
platforms = ["win-64"]
requires-pixi = ">=0.84.2"

# ---------------------------------------------------------------- shared base
[feature.py312.dependencies]
python = "3.12.*"
numpy = ">=2.1,<3"
scipy = "*"
pint = "*"
pyyaml = "*"
jsonschema = "*"
h5py = "*"
pandas = "*"
matplotlib-base = "*"

# ---------------------------------------------------------------- socle (common core physics)
[feature.socle.dependencies]
calculix = "2.23.*"
gmsh = "4.15.*"
python-gmsh = "4.15.*"
meshio = "*"
pyvista = "0.49.*"
vtk = "9.7.*"
optuna = "5.*"
pymoo = "0.6.*"
salib = "1.6.*"
smt = "2.15.*"
scikit-learn = "*"
control = "0.10.*"
casadi = "*"
sympy = "*"
imageio = "*"
[feature.socle.pypi-dependencies]
pylife = "*"
fatpack = "*"
sysidentpy = "*"
mujoco = ">=3.3"

# ---------------------------------------------------------------- optimisation with surrogates (torch, heavy)
[feature.opt.dependencies]
mpmath = "<=1.3"
[feature.opt.pypi-dependencies]
botorch = "==0.18.*"

# ---------------------------------------------------------------- fluids / propulsion / air
[feature.flow.dependencies]
cantera = "3.2.*"
rocketpy = "1.13.*"
jsbsim = "1.3.*"
[feature.flow.pypi-dependencies]
coolprop = "==8.*"
aerosandbox = "*"
neuralfoil = "*"
pygasflow = "*"
pymavlink = "*"

# ---------------------------------------------------------------- marine
[feature.marine.dependencies]
capytaine = "3.*"
[feature.marine.pypi-dependencies]
moordyn = "*"
arlpy = "*"

# ---------------------------------------------------------------- robots and ground vehicles
[feature.robot.dependencies]
pinocchio = "4.*"
opencv = "*"
open3d = "*"
[feature.robot.pypi-dependencies]
mink = "*"
pin-pink = "*"

# ---------------------------------------------------------------- electrical / electronics / embedded
[feature.elec.dependencies]
ngspice = "*"
pybamm = "*"
magpylib = "6.*"
scikit-rf = "2.*"
graphviz = "*"
platformio = "6.*"
[feature.elec.pypi-dependencies]
spicelib = "*"
wireviz = "*"
pyvisa = "*"
pyvisa-py = "*"

# ---------------------------------------------------------------- underground
[feature.geo.pypi-dependencies]
ogs = "*"

# ---------------------------------------------------------------- space
[feature.space.dependencies]
openjdk = "*"
[feature.space.pypi-dependencies]
orekit-jpype = "*"

# ---------------------------------------------------------------- custom PDEs (NGSolve wheels carry their own OCC:
# kept away from conda's OpenCascade, which they cannot share a process with)
[feature.pde.pypi-dependencies]
ngsolve = "*"

# ---------------------------------------------------------------- post-processing
[feature.post.dependencies]
paraview = "6.*"

# ---------------------------------------------------------------- ROS 2 Lyrical + Gazebo Jetty (scenario C)
# RoboStack binaries: no Visual Studio needed to RUN; building your own C++ packages needs the
# VS 2022 Build Tools. Gazebo Jetty (gz-sim 10) brings the buoyancy / hydrodynamics / thruster
# systems used for underwater vehicles.
[feature.ros]
channels = ["robostack-lyrical", "conda-forge"]
[feature.ros.dependencies]
python = "3.12.*"
ros-lyrical-desktop = "*"
ros-lyrical-navigation2 = "*"
ros-lyrical-moveit = "*"
ros-lyrical-ros2-control = "*"
ros-lyrical-ros2-controllers = "*"
ros-lyrical-ros-gz = "*"
ros-lyrical-gz-ros2-control = "*"
ros-lyrical-slam-toolbox = "*"
ros-lyrical-xacro = "*"
ros-lyrical-robot-state-publisher = "*"
gz-sim = "10.*"
colcon-common-extensions = "*"

[environments]
sim = { features = ["py312", "socle", "marine"] }
aero = { features = ["py312", "flow"], no-default-feature = true }
opt = { features = ["py312", "socle", "opt"] }
robot = { features = ["py312", "socle", "robot"] }
elec = { features = ["py312", "elec"] }
geo = { features = ["py312", "geo"], no-default-feature = true }
space = { features = ["py312", "space"], no-default-feature = true }
pde = { features = ["py312", "pde"], no-default-feature = true }
post = { features = ["post"], no-default-feature = true }
ros = { features = ["ros"], no-default-feature = true }
