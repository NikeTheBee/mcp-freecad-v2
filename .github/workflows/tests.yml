name: tests

# Runs the bundled-FreeCAD test suite against a conda-forge FreeCAD, plus a
# secret scan of the whole git history.
# On Linux, graft tests and the end-to-end launcher / MCP-loop tests are SKIP
# (they need the Windows install); the windows-full job runs them all on the
# official FreeCAD Windows build.

# Linux runners pinned to the image the suite is validated on: ubuntu-latest
# moves to a new release on GitHub's schedule, not ours (Ubuntu 26, 2026-10-19).

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Unit tests of the vendored base (server/freecad-mcp, modified in v2). They
  # are written for Linux/macOS (AF_UNIX, /tmp), so they run here, not on Windows.
  base-unit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server/freecad-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install base + dev deps (from its lockfile)
        run: uv sync --frozen --group dev
      - name: Run the base's unit tests
        run: uv run python -m pytest tests/unit/ -q


  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scan every commit, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  freecad-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up FreeCAD (conda-forge)
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: fc
          create-args: >-
            python=3.11
            freecad=1.1
            calculix
            gmsh
            matplotlib-base

      - name: Run core test suite
        shell: bash -el {0}
        env:
          MCPFC_SKIP_GRAFTS: "1"
          # conda-forge headless TechDraw segfaults during view recompute
          # (native crash) — reported as SKIP, validated on the Windows target.
          # See docs/COMPATIBILITY.md R11.
          MCPFC_SKIP_TECHDRAW: "1"
        run: |
          FCBIN="$(which freecadcmd || which FreeCADCmd)"
          echo "freecadcmd: $FCBIN"
          export FREECAD_MCP_FREECAD_BIN="$FCBIN"
          python install/run_all_tests.py

  # The real target: Windows + the official FreeCAD 1.1.1 build (portable
  # archive, SHA-256 pinned). One-command install with the grafts, then EVERY
  # test, including the launcher, the MCP loops and the live base fixes on an
  # isolated FreeCAD instance. Nothing is skipped here.
  windows-full:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      FC_VERSION: "1.1.1"
      FC_ARCHIVE: FreeCAD_1.1.1-Windows-x86_64-py311.7z
      FC_SHA256: aef51acb6725d5667bbae73494d04794a1e1725e17c6589650b044c15808144f
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Cache FreeCAD
        id: fccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\freecad
          key: freecad-win-${{ env.FC_SHA256 }}

      - name: Download FreeCAD (SHA-256 checked)
        if: steps.fccache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $out = Join-Path $env:RUNNER_TEMP $env:FC_ARCHIVE
          Invoke-WebRequest "https://github.com/FreeCAD/FreeCAD/releases/download/$env:FC_VERSION/$env:FC_ARCHIVE" -OutFile $out
          $got = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:FC_SHA256) { throw "FreeCAD archive SHA-256 mismatch: $got" }
          7z x $out "-o$env:RUNNER_TEMP\freecad" -y | Out-Null
          Remove-Item $out

      - name: Locate freecadcmd
        shell: pwsh
        run: |
          # the real binary lives in bin\ (the archive root also has a launcher stub)
          $bin = Get-ChildItem "$env:RUNNER_TEMP\freecad" -Recurse -Filter freecadcmd.exe |
                 Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          if (-not $bin) { throw "freecadcmd.exe not found in the archive" }
          "FREECAD_MCP_FREECAD_BIN=$($bin.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "freecadcmd: $($bin.FullName)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - name: Install (venv, addon, grafts) and run every test
        shell: pwsh
        run: python install/bootstrap.py --with-grafts --client none
